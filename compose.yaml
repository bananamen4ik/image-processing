services:
  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    shm_size: 128mb
    env_file: ./postgres/.env
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:8.10-alpine3.23
    restart: unless-stopped
    volumes:
      - redis-data:/data
      - ./redis:/usr/local/etc/redis
    command:
      - "redis-server"
      - "/usr/local/etc/redis/redis.conf"

volumes:
  postgres-data:
  redis-data: