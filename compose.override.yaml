services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  celery-worker:
    entrypoint:
      - "uv"
      - "run"
      - "--locked"
      - "--all-extras"
      - "--dev"
      - "celery"
      - "-A"
      - "image_processing"
      - "worker"
      - "-l"
      - "INFO"