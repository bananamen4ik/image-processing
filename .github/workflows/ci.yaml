name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  tests:
    name: Run Tests
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7

      - name: Setup UV
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.13.6
          enable-cache: true

      - name: Setup Project
        run: uv sync --locked --all-extras --dev

      - name: Setup ENV files
        run: |
          cp postgres/.env.ci postgres/.env
          cp src/image-processing/.env.ci src/image-processing/.env

      - name: Setup Docker
        run: docker compose up -d

      - name: Run Tests
        run: |
          uv run --no-sync pre-commit run
          uv run --no-sync pre-commit run --hook-stage=manual