server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name localhost;

    # Local DEV
    ssl_certificate /etc/nginx/ssl/localhost.pem;
    ssl_certificate_key /etc/nginx/ssl/localhost-key.pem;

    # Lets Encrypt (Certbot)
    # ssl_certificate /etc/nginx/ssl/letsencrypt/live/example.com/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/letsencrypt/live/example.com/privkey.pem;
    # include /etc/nginx/ssl/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/nginx/ssl/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://gunicorn:8000;

        proxy_redirect off;
        client_max_body_size 10M;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /usr/share/nginx/staticfiles/;
    }

    location /media/ {
        alias /usr/share/nginx/media/;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    return 301 https://$host$request_uri;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    ssl_reject_handshake on;

    return 444;
}