[project]
name = "image-processing"
version = "0.1.0"
authors = [
    { name = "Armen Akopyan", email = "bananamen4ik@icloud.com" },
]
description = "A Django-based web service for processing images."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.1",
    "django-environ>=0.14.0",
    "psycopg[binary]>=3.3.6",
    "redis[hiredis]>=8.1.0",
]

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "django-debug-toolbar>=8.0.0",
    "django-stubs>=6.1.2",
    "faker>=40.43.0",
    "pre-commit>=4.7.0",
    "ruff>=0.17.0",
    "ty>=0.0.87",
]

# Coverage
[tool.coverage.run]
command_line = "manage.py test"
source = ["."]
branch = true
omit = [
    "*/migrations/*.py",
    "*/asgi.py",
    "*/wsgi.py",
    "manage.py",
]

# Ruff
[tool.ruff]
line-length = 88

[tool.ruff.format]
exclude = ["*/migrations/*.py"]
quote-style = "single"

[tool.ruff.lint]
extend-select = [
    "ANN",
    "D",
]
ignore = ["ANN401"]
exclude = ["*/migrations/*.py"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# Ty
[tool.ty.rules]
unresolved-attribute = "ignore"
