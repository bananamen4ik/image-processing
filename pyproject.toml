[project]
name = "image-processing"
version = "0.1.0"
authors = [
    { name = "Armen Akopyan", email = "bananamen4ik@icloud.com" },
]
description = "A Django-based web service for processing images."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.1",
    "django-environ>=0.14.0",
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "django-stubs>=6.1.2",
    "faker>=40.43.0",
]

[tool.coverage.run]
command_line = "manage.py test"
source = ["."]
branch = true
omit = [
    "*/asgi.py",
    "*/wsgi.py",
    "manage.py",
]
