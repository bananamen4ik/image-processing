{% load i18n %}

<nav class="navbar navbar-expand-lg border-bottom">
    <div class="container">
        <a class="navbar-brand fw-semibold" href="{% url 'main:index' %}">
            {% translate 'Image Processing' %}
        </a>

        <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarContent"
                aria-controls="navbarContent"
                aria-expanded="false"
                aria-label="{% translate 'Toggle navigation' %}"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'main:index' %}">
                        {% translate 'Home' %}
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'main:plans' %}">
                        {% translate 'Plans' %}
                    </a>
                </li>
            </ul>

            {% if user.is_authenticated %}
                <div class="dropdown">
                    <button
                            class="btn btn-outline-primary dropdown-toggle"
                            type="button"
                            data-bs-toggle="dropdown"
                            aria-expanded="false"
                    >
                        {{ user.username }}
                    </button>

                    <ul class="dropdown-menu">
                        <li>
                            <a class="dropdown-item" href="{% url 'user_profile:index' %}">
                                {% translate 'Profile' %}
                            </a>
                        </li>

                        <li>
                            <a class="dropdown-item" href="#">
                                {% translate 'Dashboard' %}
                            </a>
                        </li>

                        <li>
                            <hr class="dropdown-divider">
                        </li>

                        <li>
                            <form action="{% url 'custom_auth:logout' %}" method="post">
                                {% csrf_token %}
                                <button type="submit" class="dropdown-item">
                                    {% translate 'Log out' %}
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            {% else %}
                <div class="d-flex gap-2">
                    <a href="{% url 'custom_auth:login' %}" class="btn btn-outline-primary">
                        {% translate 'Log in' %}
                    </a>

                    <a href="{% url 'custom_auth:signup' %}" class="btn btn-primary">
                        {% translate 'Get started' %}
                    </a>
                </div>
            {% endif %}
        </div>
    </div>
</nav>
